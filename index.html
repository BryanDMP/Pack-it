<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pack-it</title>
    <link rel="preload" href="./fonts/nunito-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./fonts/nunito-700.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face {
        font-family: "Nunito";
        font-weight: 400;
        src: url("./fonts/nunito-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Nunito";
        font-weight: 700;
        src: url("./fonts/nunito-700.woff2") format("woff2");
      }
    </style>
<style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0d0d1a;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }
      canvas { display: block; image-rendering: auto; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
